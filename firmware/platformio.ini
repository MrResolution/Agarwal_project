; Optional: build with PlatformIO instead of the Arduino IDE.  `pio run -t upload -t monitor`
; Copy svs_hub/config.example.h to svs_hub/config.h first.

[platformio]
src_dir = svs_hub

[env:esp32s3]
; pioarduino platform = Arduino-ESP32 core 3.x (the stock espressif32 platform ships core 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi   ; N16R8: 16 MB flash, 8 MB octal PSRAM
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bertmelis/espMqttClient@^1.7.0
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit NeoPixel@^1.12.3
    adafruit/Adafruit MPU6050@^2.2.6
